# Test Environment Configuration using In-Memory H2 Database
spring.application.name=ssl-checker-backend-test

# In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:sslcheckertest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Test Secret (HMAC-SHA minimum 256 bits)
jwt.secret=ssl-checker-super-secret-key-2024-production-grade-jwt-secret-key-minimum-256bits
jwt.expiration=3600000

# Mail Configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@sslguard.local
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# SSL Check Configuration
ssl.check.timeout.seconds=5
ssl.monitoring.cron=0 0 6 * * ?

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:5173
